services:
  api:
    build:
      context: .
      dockerfile: src/Lucid.Api/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=lucid
      - Redis__ConnectionString=redis:6379
      - S3__Bucket=lucid-files
      - S3__Region=us-east-1
      - S3__Endpoint=http://localstack:4566
      - S3__AccessKey=test
      - S3__SecretKey=test
      - Jwt__Key=your-super-secret-key-min-32-chars-long!!
      - Jwt__Issuer=lucid
      - Jwt__Audience=lucid
    depends_on:
      - mongo
      - redis
      - localstack

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh

volumes:
  mongo-data:
